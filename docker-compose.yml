services:
  postgres:
    image: postgres:16-alpine
    container_name: talenthub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: talenthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  talenthub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talenthub_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/talenthub
      JWT_SECRET: talenthub-secure-production-jwt-key-2026
      JWT_EXPIRES_IN: 24h
      STORAGE_PATH: /app/uploads/offers
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - offer_uploads:/app/uploads/offers

volumes:
  pgdata:
  offer_uploads:

